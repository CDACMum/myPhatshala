services:
  namenode:
    image: apache/hadoop:3.5.0
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - 9870:9870
    env_file:
      - ./config
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-hadoop/dfs/name"
    volumes:
      - ./topology.sh:/opt/topology.sh:ro
  secondarynamenode:
    image: apache/hadoop:3.5.0
    hostname: secondarynamenode
    command: ["hdfs", "secondarynamenode"]
    env_file:
      - ./config
  datanode:
    image: apache/hadoop:3.5.0
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
